<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #efe7da; }
      #root { width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.4" data-width="1920" data-height="1080">
      <!-- one continuous piece of real product footage, cut at media offsets -->
      <div class="clip" data-composition-id="f01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="4.6" data-track-index="0"></div>
      <div class="clip" data-composition-id="f02-strum" data-composition-src="compositions/frames/02-strum.html" data-start="4.6" data-duration="6" data-track-index="1"></div>
      <div class="clip" data-composition-id="f03-drop" data-composition-src="compositions/frames/03-drop.html" data-start="10.6" data-duration="6.2" data-track-index="2"></div>
      <div class="clip" data-composition-id="f04-scrub" data-composition-src="compositions/frames/04-scrub.html" data-start="16.8" data-duration="4.4" data-track-index="3"></div>
      <div class="clip" data-composition-id="f05-ticket" data-composition-src="compositions/frames/05-ticket.html" data-start="21.2" data-duration="4.6" data-track-index="4"></div>
      <div class="clip" data-composition-id="f06-url" data-composition-src="compositions/frames/06-url.html" data-start="25.8" data-duration="4.6" data-track-index="5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 30.4 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
